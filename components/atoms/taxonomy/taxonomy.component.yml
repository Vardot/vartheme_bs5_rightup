$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Taxonomy
group: Base
status: stable
props:
  type: object
  required:
    - label
  properties:
    label:
      type:
        - string
        - integer
      title: Label
      description: 'Text shown inside the taxonomy badge. An integer is accepted so a numeric field — an episode number, a year — can be bound straight to it.'
      examples:
        - Taxonomy
    prefix:
      type: string
      title: Prefix
      description: 'Fixed word printed before the label, for an eyebrow whose label comes from a number or a term — for example a Prefix of "Episode" with a label of "17" reads "EPISODE 17". Leave empty to print the label alone.'
      default: ''
    url:
      type: string
      title: Link (optional)
      format: uri-reference
      description: If provided, taxonomy will render as a link.
      default: ''
    target:
      type: string
      title: Link target
      description: Where to open the link (only used when Link is provided).
      enum:
        - _self
        - _blank
      default: _self
      examples:
        - _self
      meta:enum:
        _self: Same tab
        _blank: New tab
    size:
      type: string
      title: Size
      description: Controls the typography size (taxonomy modifier class).
      enum:
        - taxonomy-lg
        - taxonomy-sm
      default: taxonomy-lg
      examples:
        - taxonomy-lg
      meta:enum:
        taxonomy-lg: Large
        taxonomy-sm: Small
    color:
      type: string
      title: Color
      description: Bootstrap text color utility for the badge label.
      enum:
        - text-tertiary
        - text-accent
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-dark
        - text-white
        - text-muted
      default: text-tertiary
      examples:
        - text-tertiary
      meta:enum:
        text-tertiary: Tertiary (default)
        text-accent: Accent
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-dark: Dark
        text-white: White
        text-muted: Muted
    no_padding:
      type: boolean
      title: Remove padding
      description: Removes the badge's padding for a flush, zero-padding taxonomy label.
      default: false
      examples: [false]
    justify_content:
      type: string
      title: Horizontal alignment
      description: Controls the horizontal alignment of the badge content (justify-content modifier class).
      enum:
        - justify-content-start
        - justify-content-center
        - justify-content-end
      default: justify-content-center
      examples:
        - justify-content-center
      meta:enum:
        justify-content-start: Left
        justify-content-center: Center
        justify-content-end: Right
