$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Live Feed Item
group: Base
status: stable
description: A single timestamped news item, meant to be dropped into a Live Feed component's "Items" slot.
props:
  type: object
  required:
    - title
  properties:
    time:
      type: string
      title: Time
      description: 'Short timestamp shown before the title. Leave empty and set Timestamp instead when the time comes from a content field.'
      default: ''
      examples:
        - '5:10 PM'
    timestamp:
      type: integer
      title: Timestamp
      description: 'UNIX timestamp used instead of Time, so a feed built from content can take the time from a date field. Formatted with Time format.'
      examples:
        - 1789459200
    time_format:
      type: string
      title: Time format
      description: 'PHP date format applied to Timestamp. Defaults to the design''s 12-hour clock.'
      default: 'g:i A'
      examples:
        - 'g:i A'
    title:
      type: string
      title: Title
      description: The news item's headline.
      examples:
        - Adobe Quietly Kills Its Font-Pairing Tool
    url:
      type: string
      title: Link URL (optional)
      format: uri-reference
      description: If provided, the item renders as a link to this URL.
      default: ''
