$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon Toggle
status: stable
description: "A single icon button for the header/navbar (or anywhere else). Clicking it overlays a popover panel holding whatever is dropped into its 'content' slot — e.g. the 'Exposed form: search-page' block for a search toggle — without hiding the surrounding navigation; clicking again (or Escape / outside click) closes it."
group: Navigation
props:
  type: object
  properties:
    icon:
      type: string
      title: Icon
      description: Bootstrap Icon name shown in the closed state (without the "bi-" prefix). Swaps to a close (X) icon while the panel is open.
      x-canvas-icon:
        - bootstrap_icons
      enum:
        - search
        - facebook
        - twitter-x
        - instagram
        - linkedin
        - x
        - plus
        - exclamation
        - check
        - dash
        - question
        - info
        - person
        - people
        - person-plus
        - person-check
        - chevron-up
        - chevron-down
        - chevron-left
        - chevron-right
        - chevron-double-up
        - chevron-double-down
        - chevron-double-left
        - chevron-double-right
        - arrow-up
        - arrow-down
        - arrow-left
        - arrow-right
        - arrow-up-right
        - arrow-up-left
        - arrow-down-right
        - arrow-down-left
        - arrow-repeat
        - arrows-angle-expand
        - arrows-angle-contract
        - play
        - pause
        - skip-backward
        - skip-forward
        - circle
        - circle-fill
        - record-circle
        - arrow-right-circle-fill
        - arrow-left-circle-fill
        - arrow-up-circle-fill
        - arrow-down-circle-fill
        - caret-right-fill
        - caret-left-fill
        - caret-up-fill
        - caret-down-fill
      default: search
      examples:
        - search
      meta:enum:
        search: Search
        facebook: Facebook
        twitter-x: Twitter X
        instagram: Instagram
        linkedin: LinkedIn
        x: Close (X)
        plus: Plus
        exclamation: Exclamation
        check: Check
        dash: Dash
        question: Question
        info: Info
        person: Person
        people: People
        person-plus: Person Plus
        person-check: Person Check
        chevron-up: Chevron Up
        chevron-down: Chevron Down
        chevron-left: Chevron Left
        chevron-right: Chevron Right
        chevron-double-up: Chevron Double Up
        chevron-double-down: Chevron Double Down
        chevron-double-left: Chevron Double Left
        chevron-double-right: Chevron Double Right
        arrow-up: Arrow Up
        arrow-down: Arrow Down
        arrow-left: Arrow Left
        arrow-right: Arrow Right
        arrow-up-right: Arrow Up Right
        arrow-up-left: Arrow Up Left
        arrow-down-right: Arrow Down Right
        arrow-down-left: Arrow Down Left
        arrow-repeat: Arrow Repeat
        arrows-angle-expand: Expand
        arrows-angle-contract: Contract
        play: Play
        pause: Pause
        skip-backward: Skip Backward
        skip-forward: Skip Forward
        circle: Circle
        circle-fill: Circle Filled
        record-circle: Record Circle
        arrow-right-circle-fill: Arrow Right Circle Filled
        arrow-left-circle-fill: Arrow Left Circle Filled
        arrow-up-circle-fill: Arrow Up Circle Filled
        arrow-down-circle-fill: Arrow Down Circle Filled
        caret-right-fill: Caret Right Filled
        caret-left-fill: Caret Left Filled
        caret-up-fill: Caret Up Filled
        caret-down-fill: Caret Down Filled
    label:
      type: string
      title: Label
      description: Accessible label for the button in its closed state (visually hidden).
      default: Search
      examples:
        - Search
    open_label:
      type: string
      title: Open state label
      description: Accessible label announced on the button while the panel is open.
      default: Close search
      examples:
        - Close search
    icon_color:
      type: string
      title: Icon color
      description: Bootstrap text color utility class used to control the icon's color.
      enum:
        - text-body
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-light
        - text-dark
        - text-white
        - text-muted
        - text-body-secondary
        - text-body-tertiary
        - text-primary-emphasis
        - text-secondary-emphasis
        - text-success-emphasis
        - text-danger-emphasis
        - text-warning-emphasis
        - text-info-emphasis
      default: text-body
      examples:
        - text-body
      meta:enum:
        text-body: Body
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-light: Light
        text-dark: Dark
        text-white: White
        text-muted: Muted
        text-body-secondary: Body secondary
        text-body-tertiary: Body tertiary
        text-primary-emphasis: Primary emphasis
        text-secondary-emphasis: Secondary emphasis
        text-success-emphasis: Success emphasis
        text-danger-emphasis: Danger emphasis
        text-warning-emphasis: Warning emphasis
        text-info-emphasis: Info emphasis
    panel_width:
      type: string
      title: Panel width
      description: "How wide the revealed panel is. 'popover' anchors a narrow panel under the icon. 'full' spans the full width of the viewport, as a bar directly below the header, which is what the header search uses."
      enum:
        - popover
        - full
      default: popover
    placement:
      type: string
      title: Panel alignment
      description: Which side of the button the popover panel aligns to (logical, RTL-aware).
      enum:
        - end
        - start
      meta:enum:
        end: End side
        start: Start side
      default: end
      examples:
        - end
    expand_in_editor:
      type: boolean
      title: Expand in Canvas editor
      description: Force the popover open while previewed inside the Drupal Canvas editor, so its "content" slot stays reachable for dropping components in. Turn off once content is placed, if the always-open panel clutters the editor view — the front-end click/close behavior is unaffected either way.
      default: true
      examples:
        - true
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: HTML attributes for the root element.
slots:
  content:
    title: Content
    description: "The content revealed in the popover, e.g. the 'Exposed form: search-page' block for a search toggle."
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
