$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Horizontal Text Icon Card
group: Card
status: stable
description: 'Full-width horizontal card: a flexible content slot (category, heading, text, meta, button, etc.) on the start side and a fixed circular play icon in one of two brand colors on the end side. The heading in the slot underlines on hover.'
props:
  type: object
  properties:
    icon_color:
      type: string
      title: Icon color
      description: Bootstrap theme color for the circular icon background.
      enum:
        - bg-tertiary
        - bg-accent
      default: bg-tertiary
      examples:
        - bg-tertiary
      meta:enum:
        bg-tertiary: Blue
        bg-accent: Accent (Mint)

    background_color:
      type: string
      title: Background color
      description: Brand background color applied to the card.
      enum:
        - none
        - bg-body-tertiary
        - bg-tertiary
        - bg-accent
        - bg-primary
        - bg-primary-subtle
        - bg-secondary
        - bg-secondary-subtle
        - bg-dark
      default: bg-primary
      examples:
        - bg-primary
      meta:enum:
        none: None
        bg-body-tertiary: Body tertiary
        bg-tertiary: Tertiary
        bg-accent: Accent
        bg-primary: Primary
        bg-primary-subtle: Primary subtle
        bg-secondary: Secondary
        bg-secondary-subtle: Secondary subtle
        bg-dark: Dark

    corner_style:
      type: string
      title: Border radius
      description: Bootstrap rounded utility applied to the card.
      enum:
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-5
        - rounded-pill
      default: rounded-0
      examples:
        - rounded-0
      meta:enum:
        rounded-0: None (square)
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-5: Extra Extra Large
        rounded-pill: Pill

    padded:
      type: boolean
      title: Padded
      description: Adds Bootstrap padding (p-4) to the card. When disabled, the card has no padding (p-0).
      default: true
      examples:
        - true

    content_vertical_alignment:
      type: string
      title: Content vertical alignment
      description: Vertical alignment of the content slot and icon within the row.
      enum:
        - align-items-start
        - align-items-center
        - align-items-end
      default: align-items-center
      examples:
        - align-items-center
      meta:enum:
        align-items-start: Top
        align-items-center: Center
        align-items-end: Bottom

    stretched_link:
      type: boolean
      title: Stretched link
      description: When enabled and a Card link URL is provided, the entire card becomes clickable using Bootstrap's stretched-link.
      default: false
      examples:
        - false

    link_url:
      type: string
      title: Card link URL
      format: uri-reference
      description: Optional URL for the card link. Only used when Stretched link is enabled.
      default: ''

    link_target:
      type: string
      title: Link target
      description: Where to open the card link. Only used when Stretched link is enabled and a Card link URL is provided.
      enum:
        - _self
        - _blank
      default: _self
      examples:
        - _self
      meta:enum:
        _self: Same tab
        _blank: New tab
slots:
  content:
    title: Content
    description: Flexible content area for the start side — combine taxonomy/category label, heading, text, meta line, button, etc.
